<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio của HngQun — phát triển Odoo, Python, JavaScript và các giải pháp web.">
  <meta name="theme-color" content="#10130f">
  <title>HngQun — Odoo Developer</title>
  <script>
    // Deter common DevTools shortcuts; this is not a security boundary.
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    }, { capture: true });

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const windowsDevTools = event.ctrlKey && event.shiftKey &&
        ['i', 'j', 'c', 'k'].includes(key);
      const macDevTools = event.metaKey && event.altKey &&
        ['i', 'j', 'c', 'k'].includes(key);

      if (key === 'f12' || windowsDevTools || macDevTools) {
        event.preventDefault();
      }
    }, { capture: true });
  </script>
  <style>
    :root {
      color-scheme: dark;
      --background: #10130f;
      --surface: #171b16;
      --surface-raised: #1d221c;
      --text: #f0f1e9;
      --muted: #9da397;
      --accent: #c4f16b;
      --line: rgba(240, 241, 233, 0.12);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 7%, rgba(196, 241, 107, 0.09), transparent 31rem),
        var(--background);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .wrap { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 82px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      background: var(--accent);
      color: #14180e;
      font-size: 14px;
      font-weight: 850;
    }

    .nav { display: flex; align-items: center; gap: 31px; }
    .nav a { color: var(--muted); font-size: 13px; transition: color 160ms ease; }
    .nav a:hover { color: var(--text); }
    .nav .nav-contact { color: var(--accent); }

    .hero {
      display: grid;
      min-height: 580px;
      grid-template-columns: minmax(0, 1fr) 360px;
      align-items: center;
      gap: 60px;
      padding-block: 74px 92px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(196, 241, 107, 0.7);
    }

    h1 {
      max-width: 720px;
      margin: 23px 0 20px;
      font-size: clamp(46px, 7vw, 78px);
      font-weight: 730;
      letter-spacing: -0.075em;
      line-height: 1.02;
    }

    h1 span { color: var(--accent); }
    .hero-copy { max-width: 575px; color: var(--muted); font-size: 16px; }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .button:hover { transform: translateY(-2px); border-color: rgba(196, 241, 107, 0.55); }
    .button-primary { border-color: var(--accent); background: var(--accent); color: #14180e; }
    .button-primary:hover { background: #d3fa82; }
    .button svg, .social-link svg { width: 17px; height: 17px; fill: currentColor; }

    .profile-card {
      position: relative;
      overflow: hidden;
      padding: 27px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background:
        radial-gradient(circle at 100% 0, rgba(196, 241, 107, 0.15), transparent 55%),
        var(--surface);
    }

    .profile-card::before {
      position: absolute;
      top: -34px;
      right: -28px;
      width: 130px;
      height: 130px;
      border: 1px solid rgba(196, 241, 107, 0.2);
      border-radius: 50%;
      content: "";
    }

    .avatar {
      display: grid;
      width: 62px;
      height: 62px;
      place-items: center;
      margin-bottom: 22px;
      border: 1px solid rgba(196, 241, 107, 0.4);
      border-radius: 18px;
      background: rgba(196, 241, 107, 0.11);
      color: var(--accent);
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.07em;
    }

    .profile-scene {
      height: 180px;
      margin: -10px -10px 20px;
      border-radius: 12px;
      background: radial-gradient(circle, rgba(196, 241, 107, 0.12), transparent 70%);
    }
    .profile-scene canvas { display: block; width: 100%; height: 100%; }
    .profile-scene[hidden] { display: none; }

    .profile-card h2 { margin: 0; font-size: 21px; letter-spacing: -0.04em; }
    .profile-card > p { margin: 5px 0 22px; color: var(--muted); font-size: 13px; }
    .card-divider { height: 1px; background: var(--line); }
    .profile-meta { display: grid; gap: 13px; padding-top: 18px; }
    .meta-row { display: flex; justify-content: space-between; gap: 16px; font-size: 12px; }
    .meta-label { color: var(--muted); }
    .meta-value { overflow-wrap: anywhere; text-align: right; font-weight: 650; }
    .meta-value a { color: inherit; }
    .meta-value a:hover { color: var(--accent); }

    .socials { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 23px; }
    .social-link {
      display: inline-flex;
      min-height: 39px;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      transition: color 160ms ease, border-color 160ms ease;
    }
    .social-link:hover { border-color: var(--accent); color: var(--accent); }

    .section { padding-block: 82px; border-top: 1px solid var(--line); }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 31px; }
    .section-kicker { margin: 0 0 8px; color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: 0.15em; text-transform: uppercase; }
    h2.section-title { margin: 0; font-size: clamp(28px, 4vw, 39px); letter-spacing: -0.06em; line-height: 1.12; }
    .section-intro { max-width: 410px; margin: 0; color: var(--muted); font-size: 13px; }

    .tech-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .tech-card {
      min-height: 130px;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(255,255,255,0.025), transparent 75%), var(--surface);
      transition: border-color 160ms ease, transform 160ms ease;
    }
    .tech-card:hover { transform: translateY(-3px); border-color: rgba(196, 241, 107, 0.42); }
    .tech-icon { display: grid; width: 30px; height: 30px; place-items: center; margin-bottom: 14px; border-radius: 8px; background: rgba(196, 241, 107, 0.1); color: var(--accent); font-size: 11px; font-weight: 800; }
    .tech-card h3 { margin: 0 0 3px; font-size: 14px; letter-spacing: -0.02em; }
    .tech-card p { margin: 0; color: var(--muted); font-size: 11px; }

    .focus-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .focus-card { padding: 23px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .focus-number { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: 0.08em; }
    .focus-card h3 { margin: 16px 0 7px; font-size: 16px; letter-spacing: -0.035em; }
    .focus-card p { margin: 0; color: var(--muted); font-size: 12px; }

    .contact-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 32px;
      border: 1px solid rgba(196, 241, 107, 0.25);
      border-radius: 14px;
      background: linear-gradient(110deg, rgba(196, 241, 107, 0.1), transparent 76%), var(--surface);
    }
    .contact-panel h2 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.06em; }
    .contact-panel p { margin: 0; color: var(--muted); font-size: 13px; }
    .contact-panel .button { flex: 0 0 auto; }

    footer { display: flex; justify-content: space-between; gap: 20px; padding-block: 25px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    footer a { color: var(--text); }

    @media (max-width: 760px) {
      .hero { min-height: 0; grid-template-columns: 1fr; gap: 38px; padding-block: 72px; }
      .profile-card { max-width: 460px; }
      .tech-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .focus-grid { grid-template-columns: 1fr; }
      .section-heading { align-items: start; flex-direction: column; }
      .section-intro { max-width: 520px; }
      .section { padding-block: 65px; }
    }

    @media (max-width: 480px) {
      .wrap { width: min(100% - 34px, 1120px); }
      .topbar { min-height: 70px; }
      .nav { gap: 15px; }
      .nav a { font-size: 11px; }
      .nav a:nth-child(2) { display: none; }
      .hero { padding-block: 58px; }
      h1 { font-size: clamp(43px, 13vw, 60px); }
      .hero-copy { font-size: 14px; }
      .tech-grid { gap: 9px; }
      .tech-card { min-height: 122px; padding: 15px; }
      .contact-panel { align-items: start; flex-direction: column; padding: 24px; }
      footer { flex-direction: column; gap: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body><h1 style="text-align:center; margin-top: 20%;">alo alo 12333444</h1>
</body>
</html>
