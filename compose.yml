services:
  web:
    image: "learn-cicd:${IMAGE_TAG:?Set IMAGE_TAG to the built commit}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
